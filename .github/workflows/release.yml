name: Release

# Publishes to npm through Trusted Publishing (OIDC): the registry verifies this
# workflow's identity and mints a short-lived credential for one publish, so no
# npm token exists anywhere. npm removed the tokens that bypassed 2FA, which is
# why a long-lived token cannot do this job any more.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token npm exchanges for a publish credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: node scripts/build.mjs

      # The type checker needs the DSH sources it imports; this repository is a
      # plugin, not the harness, so it has no type database of its own. The build
      # and the tests below cover what can be checked here, and
      # `tsc -p tsconfig.dev.json` runs on a checkout beside a DSH tree.
      - name: Unit tests
        run: node --experimental-strip-types --test tests/*.test.ts

      # A published tarball that does not match src is worse than no release, so
      # the committed artifacts are verified rather than trusted.
      - name: Verify committed artifacts match a fresh build
        run: |
          if ! git diff --quiet --exit-code -- lib; then
            echo "::error::lib/ is stale; run 'node scripts/build.mjs' and commit the result"
            git --no-pager diff --stat -- lib
            exit 1
          fi

      - name: Publish
        # --provenance attaches a signed attestation tying the tarball to this
        # run; it is only available with OIDC.
        run: npm publish --access public --provenance
